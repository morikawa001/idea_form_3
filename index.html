<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIT ヒアリングフォーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-brand">
      <svg class="brand-logo" viewBox="0 0 44 44" fill="none" aria-label="MITロゴ">
        <circle cx="22" cy="22" r="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        <path d="M12 31 L22 13 L32 31" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15.5 25 L28.5 25" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="22" cy="9" r="2.5" fill="white"/>
      </svg>
      <div>
        <div class="brand-title">Medical Innovation Triage</div>
        <div class="brand-sub">現場ヒアリング支援ツール</div>
      </div>
    </div>
  </div>
</header>

<!-- ===== 中央パズルメニュー ===== -->
<div class="puzzle-menu-wrap">
  <div class="puzzle-menu">
    <!-- 上段：P / C -->
    <button class="puzzle-item puzzle-item-top-left"  data-step="1">
      <div class="puzzle-emoji">🔍</div>
      <div class="puzzle-label"><span class="pico-tag">P</span> 困りごと</div>
    </button>

    <button class="puzzle-item puzzle-item-top-right" data-step="2">
      <div class="puzzle-emoji">🔄</div>
      <div class="puzzle-label"><span class="pico-tag">C</span> 今の対応</div>
    </button>

    <!-- 中央：基本情報（少し大きめのピース） -->
    <button class="puzzle-center" data-step="0">
      <div class="puzzle-center-emoji">👤</div>
      <div class="puzzle-center-label">基本情報</div>
    </button>

    <!-- 下段：I / O -->
    <button class="puzzle-item puzzle-item-bottom-left" data-step="3">
      <div class="puzzle-emoji">💡</div>
      <div class="puzzle-label"><span class="pico-tag">I</span> アイデア</div>
    </button>

    <button class="puzzle-item puzzle-item-bottom-right" data-step="4">
      <div class="puzzle-emoji">📊</div>
      <div class="puzzle-label"><span class="pico-tag">O</span> 期待効果</div>
    </button>
  </div>
  <p class="puzzle-hint">
    真ん中の<strong>「基本情報」</strong>からでも、周りのピースからでも始められます。<br>
    いずれかのパネルを押すと、その入力画面に移動します。
  </p>
</div>

<!-- ===== PICOロードマップ（入力中に画面上部へ） ===== -->
<div class="pico-roadmap" id="picoRoadmap">
  <div class="roadmap-inner">
    <div class="roadmap-step active" id="rm0" data-step="0">
      <div class="rm-icon">👤</div>
      <div class="rm-label">基本情報</div>
    </div>
    <div class="roadmap-line" id="rml0"></div>
    <div class="roadmap-step" id="rm1" data-step="1">
      <div class="rm-icon">🔍</div>
      <div class="rm-label"><span class="pico-tag">P</span> 困りごと</div>
    </div>
    <div class="roadmap-line" id="rml1"></div>
    <div class="roadmap-step" id="rm2" data-step="2">
      <div class="rm-icon">🔄</div>
      <div class="rm-label"><span class="pico-tag">C</span> 今の対応</div>
    </div>
    <div class="roadmap-line" id="rml2"></div>
    <div class="roadmap-step" id="rm3" data-step="3">
      <div class="rm-icon">💡</div>
      <div class="rm-label"><span class="pico-tag">I</span> アイデア</div>
    </div>
    <div class="roadmap-line" id="rml3"></div>
    <div class="roadmap-step" id="rm4" data-step="4">
      <div class="rm-icon">📊</div>
      <div class="rm-label"><span class="pico-tag">O</span> 期待効果</div>
    </div>
  </div>
</div>

<!-- ===== プログレスバー ===== -->
<div class="progress-wrap" id="progressWrap">
  <div class="progress-text">
    <span id="progress-label">書きやすいところから少しずつ記録を始めてください</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- ===== ガイドバブル ===== -->
<div class="guide-bar" id="navigator">
  <div class="guide-avatar">💬</div>
  <div class="guide-text" id="navBubble">
    真ん中の<strong>「基本情報」</strong>か、聞き取りしやすいピースから選んでください。
  </div>
</div>

<!-- ===== メインコンテンツ ===== -->
<main class="main-wrap">
<form id="ideaForm" novalidate>

  <!-- ==============================
       STEP 1: 基本情報（すべて任意）
  =============================== -->
  <section class="step-section active" id="step0">
    <div class="step-header">
      <div class="step-num">1 / 5</div>
      <h2 class="step-title">基本情報</h2>
    </div>
    <p class="step-note">すべての項目は任意です。未入力でも次へ進めます。</p>

    <div class="field-block">
      <label class="field-label" for="q1">所属部署 <span class="opt-badge">任意</span></label>
      <select id="q1" onchange="onSelectChange('q1')">
        <option value="">▼ 選択してください</option>
        <option>医局</option>
        <option>GICU</option>
        <option>手術室</option>
        <option>外来</option>
        <option>病棟</option>
        <option>リハビリテーション科</option>
        <option>薬剤部</option>
        <option>放射線科</option>
        <option>臨床検査部</option>
        <option>医療情報・システム部門</option>
        <option>臨床研究支援センター</option>
        <option>事務部門</option>
        <option>その他</option>
      </select>
      <div class="field-fb" id="fb-q1"></div>
    </div>

    <div class="field-block">
      <label class="field-label" for="q2">氏名 <span class="opt-badge">任意</span></label>
      <input type="text" id="q2" placeholder="山田 花子" oninput="onTextInput('q2')" autocomplete="name">
      <div class="field-fb" id="fb-q2"></div>
    </div>

    <div class="field-block">
      <label class="field-label" for="q2b">連絡先メールアドレス <span class="opt-badge">任意</span></label>
      <input type="email" id="q2b" placeholder="hanako@hospital.jp" oninput="onEmailInput('q2b')" autocomplete="email" inputmode="email">
      <div class="field-fb" id="fb-q2b"></div>
    </div>

    <div class="field-block">
      <label class="field-label">職種 <span class="opt-badge">任意</span></label>
      <div class="card-radio-group" id="q3">
        <label class="card-radio"><input type="radio" name="q3" value="医師" onchange="onRadioChange('q3'); toggleOtherInputRadio('q3-other-check','q3-other-wrap')"><span>医師</span></label>
        <label class="card-radio"><input type="radio" name="q3" value="看護師" onchange="onRadioChange('q3'); toggleOtherInputRadio('q3-other-check','q3-other-wrap')"><span>看護師</span></label>
        <label class="card-radio"><input type="radio" name="q3" value="薬剤師" onchange="onRadioChange('q3'); toggleOtherInputRadio('q3-other-check','q3-other-wrap')"><span>薬剤師</span></label>
        <label class="card-radio"><input type="radio" name="q3" value="臨床工学技士" onchange="onRadioChange('q3'); toggleOtherInputRadio('q3-other-check','q3-other-wrap')"><span>臨床工学技士</span></label>
        <label class="card-radio"><input type="radio" name="q3" value="理学療法士・作業療法士" onchange="onRadioChange('q3'); toggleOtherInputRadio('q3-other-check','q3-other-wrap')"><span>理学・作業療法士</span></label>
        <label class="card-radio"><input type="radio" name="q3" value="事務職" onchange="onRadioChange('q3'); toggleOtherInputRadio('q3-other-check','q3-other-wrap')"><span>事務職</span></label>
        <label class="card-radio"><input type="radio" name="q3" value="その他" id="q3-other-check" onchange="onRadioChange('q3'); toggleOtherInputRadio('q3-other-check','q3-other-wrap')"><span>📝 その他</span></label>
      </div>
      <div class="other-input-wrap" id="q3-other-wrap">
        <div class="textarea-mic-wrap">
          <textarea id="q3-other-text" placeholder="職種を自由に書いてください" oninput="updateProgress()"></textarea>
          <button type="button" class="btn-mic" data-mic-target="q3-other-text" onclick="startVoice('q3-other-text')" title="音声入力">🎤</button>
        </div>
      </div>
      <div class="field-fb" id="fb-q3"></div>
    </div>

    <div class="step-nav">
      <button type="button" class="btn-next" onclick="goNext(0)">
        別の観点（困りごと）も聞いてみる
        <svg viewBox="0 0 20 20" width="18" fill="currentColor"><path d="M7 4l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="sub-action-row">
      <button type="button" class="btn-clear-step" onclick="clearStep(0)">🗑️ 入力をクリア</button>
    </div>
  </section>

  <!-- 以降 STEP1〜5 の構造と内容は元の index と同じです（困りごと, 今の対応, アイデア, 期待効果, モーダル, メール, 終了画面など）。 -->
  <!-- 手元の元ファイル idea_form_3_index_html_0515-2.txt から、そのまま続き全体をコピーしてください。 -->

</form>
</main>

<!-- 終了画面・モーダル群・音声ステータスなども元ファイルと同じ -->
<!-- 最後に JS を読み込み -->
<script src="script.js"></script>
</body>
</html>
